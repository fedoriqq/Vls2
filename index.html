<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI - Генератор Видео</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        h1 { color: #a855f7; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        input[type="file"] { background: #3a3a3a; color: white; }
        input[type="text"] { background: #fff; color: #000; }
        button { background: #a855f7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #9333ea; }
        .video-box { margin-top: 20px; border: 2px dashed #a855f7; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nova AI 🎬</h1>
        <p>Замена персонажей в "Барбоскиных" на движке Seedance 2.0</p>
        
        <label>1. Загрузи оригинальное видео (Барбоскины):</label>
        <input type="file" accept="video/*">
        
        <label>2. Загрузи картинку нового персонажа:</label>
        <input type="file" accept="image/*">
        
        <label>3. Опиши замену (на английском):</label>
        <input type="text" placeholder="Например: Replace character with Shrek, 3D style...">
        
        <button onclick="alert('Вёрстка работает! Скоро подключим мозг ИИ!')">Сгенерировать мем</button>
        
        <div class="video-box">
            <p>Здесь появится готовое видео</p>
        </div>
    </div
</body>
</html>
